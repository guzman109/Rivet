name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua tests bin plugin
  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install lua-language-server and Neovim runtime types
        run: |
          mkdir -p "$RUNNER_TEMP/luals" "$RUNNER_TEMP/nvim"
          curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz | tar -xz -C "$RUNNER_TEMP/luals"
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP/nvim" --strip-components=1
          echo "VIMRUNTIME=$RUNNER_TEMP/nvim/share/nvim/runtime" >> "$GITHUB_ENV"
      - name: Check annotations
        run: |
          "$RUNNER_TEMP/luals/bin/lua-language-server" --check . --checklevel=Warning --check_out_path "$RUNNER_TEMP/luals-check.json" || {
            cat "$RUNNER_TEMP/luals-check.json"
            exit 1
          }
  linux:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install Linux tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates lua5.4 liblua5.4-dev luajit neovim make ninja-build clang clang-tools clang-format libc++-21-dev libc++abi-21-dev pkg-config python3 python3-venv
          python3 -m venv /opt/rivet-tools
          /opt/rivet-tools/bin/pip install cmake==4.4.4
          echo /opt/rivet-tools/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Lua and project checks
        env:
          CXXFLAGS: -stdlib=libc++
        run: |
          lua tests/run.lua
          luajit tests/run.lua
          lua tests/licenses.lua
          lua tests/migration.lua
          lua tests/integration.lua
          for runtime in lua luajit; do
            for test in tests/lua_provider.lua tests/native_regressions.lua tests/file_templates.lua tests/tool_config.lua tests/upgrades.lua tests/embedding.lua tests/cli_features.lua; do
              "$runtime" "$test"
            done
          done
          RIVET_TEST_FILTER='native Python' lua tests/batches.lua
      - name: Neovim checks
        env:
          XDG_STATE_HOME: /tmp/rivet-nvim-state
          NVIM_LOG_FILE: /tmp/rivet-nvim.log
        run: |
          for test in tests/nvim*.lua; do
            nvim --headless -u NONE -i NONE -l "$test"
          done
  macos:
    runs-on: macos-15
    steps:
      - name: Install macOS tools
        run: |
          brew install lua luajit neovim ninja llvm
          python3 -m venv "$RUNNER_TEMP/rivet-tools"
          "$RUNNER_TEMP/rivet-tools/bin/pip" install cmake==4.4.4
          echo "$RUNNER_TEMP/rivet-tools/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Lua and project checks
        run: |
          lua tests/run.lua
          luajit tests/run.lua
          lua tests/licenses.lua
          lua tests/migration.lua
          lua tests/integration.lua
          for runtime in lua luajit; do
            for test in tests/lua_provider.lua tests/native_regressions.lua tests/file_templates.lua tests/tool_config.lua tests/upgrades.lua tests/embedding.lua tests/cli_features.lua; do
              "$runtime" "$test"
            done
          done
      - name: Neovim checks
        env:
          XDG_STATE_HOME: ${{ runner.temp }}/rivet-nvim-state
          NVIM_LOG_FILE: ${{ runner.temp }}/rivet-nvim.log
        run: |
          for test in tests/nvim*.lua; do
            nvim --headless -u NONE -i NONE -l "$test"
          done
  docs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun x --no-install wrangler deploy --dry-run
